<h2 class="font-headline-lg text-on-surface dark:text-stone-200 mb-lg text-center">Crear cuenta</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-md">
  <div>
    <label class="font-label-sm text-on-surface-variant dark:text-stone-400 block mb-xs">Nombre</label>
    <input formControlName="name" type="text" class="w-full px-md py-3 rounded-lg border border-outline-variant dark:border-stone-700 bg-surface-container-lowest dark:bg-stone-800 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none font-body-md dark:text-stone-200" placeholder="Tu nombre" />
  </div>
  <div>
    <label class="font-label-sm text-on-surface-variant dark:text-stone-400 block mb-xs">Email</label>
    <input formControlName="email" type="email" class="w-full px-md py-3 rounded-lg border border-outline-variant dark:border-stone-700 bg-surface-container-lowest dark:bg-stone-800 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none font-body-md dark:text-stone-200" placeholder="tu@email.com" />
  </div>
  <div>
    <label class="font-label-sm text-on-surface-variant dark:text-stone-400 block mb-xs">Contraseña</label>
    <input formControlName="password" type="password" class="w-full px-md py-3 rounded-lg border border-outline-variant dark:border-stone-700 bg-surface-container-lowest dark:bg-stone-800 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none font-body-md dark:text-stone-200" placeholder="Mínimo 8 caracteres" />
  </div>

  @if (error) { <p class="text-error font-body-sm">{{ error }}</p> }

  <button type="submit" [disabled]="form.invalid || loading" class="w-full py-3 bg-primary text-on-primary rounded-xl font-label-lg active:scale-95 transition-transform disabled:opacity-50">
    {{ loading ? 'Creando...' : 'Crear cuenta' }}
  </button>
</form>

<div class="mt-lg text-center">
  <p class="font-body-sm text-on-surface-variant dark:text-stone-400">
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login" class="text-primary dark:text-primary font-semibold">Inicia sesión</a>
  </p>
</div>
