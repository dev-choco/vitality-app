<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-white dark:bg-stone-900 border-t border-stone-100 dark:border-stone-800 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] rounded-t-3xl md:hidden">
  @for (item of items; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="text-primary bg-primary-fixed/30 rounded-2xl px-5 py-2"
      [routerLinkActiveOptions]="{ exact: item.route === '/' }"
      class="flex flex-col items-center justify-center text-stone-400 dark:text-stone-500 hover:text-primary active:scale-90 transition-transform duration-150 px-3 py-2"
    >
      <span class="material-symbols-outlined text-2xl" [class.fill-icon]="false">{{ item.icon }}</span>
      <span class="font-lexend text-[10px] font-semibold mt-0.5">{{ item.label }}</span>
    </a>
  }
</nav>
