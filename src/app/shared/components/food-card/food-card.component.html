<div
  [routerLink]="['/alimentos', food.slug]"
  class="glass-card rounded-2xl overflow-hidden shadow-sm border border-white/50 flex flex-col group active:scale-[0.98] transition-transform cursor-pointer">
  <div class="relative h-56 md:h-48 w-full overflow-hidden">
    <img
      [src]="food.imageUrl"
      [alt]="food.name"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
      onerror="this.style.display='none'"
    />
    <button class="absolute top-4 right-4 bg-white/90 backdrop-blur-md p-3 rounded-full shadow-lg active:scale-110 transition-transform touch-manipulation min-w-[48px] min-h-[48px] flex items-center justify-center">
      <span class="material-symbols-outlined text-error fill-icon">favorite</span>
    </button>
  </div>
  <div class="p-lg flex flex-col flex-grow">
    <h3 class="font-headline-sm text-headline-sm text-on-surface mb-xs">{{ food.name }}</h3>
    <div class="space-y-sm mb-md">
      @if (food.primaryBenefit) {
        <div class="flex items-center gap-2 text-primary">
          <span class="material-symbols-outlined text-md">check_circle</span>
          <span class="font-label-lg text-label-lg">{{ food.primaryBenefit }}</span>
        </div>
      }
      @if (food.categoryName) {
        <div class="flex items-center gap-2 text-primary">
          <span class="material-symbols-outlined text-md">{{ food.categoryName | lowercase }}</span>
          <span class="font-label-lg text-label-lg">{{ food.categoryName }}</span>
        </div>
      }
    </div>
    @if (food.consumptionSuggestion) {
      <div class="mt-auto pt-md border-t border-outline-variant/30">
        <p class="font-label-sm text-label-sm text-tertiary mb-xs uppercase tracking-wider">Sugerencia</p>
        <p class="font-body-sm text-body-sm text-on-surface-variant">{{ food.consumptionSuggestion }}</p>
      </div>
    }
  </div>
</div>
