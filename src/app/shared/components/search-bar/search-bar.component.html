<div class="relative group">
  <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
    <span class="material-symbols-outlined text-outline">search</span>
  </div>
  <input
    [(ngModel)]="query"
    (keyup.enter)="onSearch()"
    [placeholder]="placeholder"
    type="text"
    class="w-full h-14 pl-12 pr-6 bg-surface-container-low rounded-xl md:rounded-full border-none focus:ring-2 focus:ring-primary font-body-md text-on-surface-variant shadow-sm transition-all placeholder:text-outline outline-none"
  />
</div>
