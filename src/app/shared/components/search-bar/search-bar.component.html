<div class="relative group">
  <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
    <span class="material-symbols-outlined text-outline dark:text-stone-500">search</span>
  </div>
  <input
    [(ngModel)]="query"
    (input)="onInput()"
    (keyup.enter)="onManualSearch()"
    [placeholder]="placeholder"
    type="text"
    class="w-full h-14 pl-12 pr-6 bg-surface-container-low dark:bg-stone-800 rounded-xl md:rounded-full border-none focus:ring-2 focus:ring-primary font-body-md text-on-surface-variant dark:text-stone-300 shadow-sm transition-all placeholder:text-outline dark:placeholder:text-stone-500 outline-none"
  />
</div>
