[build]
  command = "npm run generate-config && npm run build"
  publish = "dist/vitality/browser"

[[redirects]]
  from = "/api/*"
  to = "https://api.nutripage.com/vitality-api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  API_URL = "http://localhost:8080/vitality-api/v1"
  GOOGLE_CLIENT_ID = ""
